version: "1.0"
description: >
  Canonical permission registry. Backend authorization is authoritative.
  Frontend permission guards are usability controls only.

permissions:
  - code: IDENTITY_MANAGE
    resource: identity
    action: manage
    description: Assign and remove global user roles.

  - code: WORKSPACE_CREATE
    resource: workspace
    action: create
    description: Create a workspace.

  - code: WORKSPACE_READ
    resource: workspace
    action: read
    description: Read accessible workspace information.

  - code: WORKSPACE_MANAGE
    resource: workspace
    action: manage
    description: Modify workspace configuration and membership.

  - code: ENTITY_CREATE
    resource: entity
    action: create
    description: Create generic entities.

  - code: ENTITY_READ
    resource: entity
    action: read
    description: Read accessible entities.

  - code: ENTITY_UPDATE
    resource: entity
    action: update
    description: Update mutable generic entities.

  - code: ENTITY_ARCHIVE
    resource: entity
    action: archive
    description: Archive or soft-delete entities.

  - code: RELATIONSHIP_MANAGE
    resource: relationship
    action: manage
    description: Create and remove entity relationships.

  - code: METADATA_MANAGE
    resource: metadata
    action: manage
    description: Manage entity types, attributes, and related metadata.

  - code: FORM_DESIGN
    resource: form
    action: design
    description: Create, configure, version, and publish forms.

  - code: FORM_SUBMIT
    resource: form_instance
    action: submit
    description: Create/update/submit form instances.

  - code: DOCUMENT_UPLOAD
    resource: document
    action: upload
    description: Upload logical documents and new versions.

  - code: DOCUMENT_READ
    resource: document
    action: read
    description: Read/download/preview authorized documents.

  - code: DOCUMENT_ARCHIVE
    resource: document
    action: archive
    description: Archive logical documents.

  - code: IMPORT_EXECUTE
    resource: import
    action: execute
    description: Upload, dry-run, resolve, and commit imports.

  - code: PHASE_MANAGE
    resource: phase
    action: manage
    description: Create/update phases and deliverables.

  - code: PHASE_LOCK
    resource: phase
    action: lock
    description: Lock a phase.

  - code: PHASE_UNLOCK
    resource: phase
    action: unlock
    description: Unlock a phase.

  - code: REVIEW_MANAGE
    resource: review
    action: manage
    description: Add review comments, resolve comments, and request revisions.

  - code: DASHBOARD_READ
    resource: dashboard
    action: read
    description: View dashboards.

  - code: DASHBOARD_MANAGE
    resource: dashboard
    action: manage
    description: Create and configure dashboards.

  - code: AUDIT_READ
    resource: audit
    action: read
    description: View authorized audit history.

  - code: DELIVERABLE_CONTRIBUTE
    resource: deliverable
    action: contribute
    description: Prepare and revise assigned deliverable content.

  - code: DELIVERABLE_INTERNAL_REVIEW
    resource: deliverable
    action: internal_review
    description: Perform contractor-side internal review and readiness decisions.

  - code: SUBMISSION_CREATE
    resource: submission
    action: create
    description: Formally submit or resubmit an authorized immutable package.

  - code: PROJECT_MONITOR
    resource: project
    action: monitor
    description: Monitor completeness, progress, and exceptions without decision authority.

  - code: PROJECT_REVIEW
    resource: project_review
    action: review
    description: Perform project governance review.

  - code: PROJECT_RECOMMEND
    resource: project_review
    action: recommend
    description: Record a project-manager recommendation.

  - code: TECHNICAL_REVIEW
    resource: technical_review
    action: review
    description: Assess technical quality of an authorized immutable version.

  - code: TECHNICAL_SIGN_OFF
    resource: technical_review
    action: sign_off
    description: Record an authorized technical sign-off without contractual acceptance.

  - code: ACCEPTANCE_DECIDE
    resource: acceptance
    action: decide
    description: Record an employer phase or final acceptance decision.

  - code: CONDITION_VERIFY
    resource: acceptance_condition
    action: verify
    description: Verify evidence for an assigned acceptance condition.

  - code: COMMUNICATION_MANAGE
    resource: communication
    action: manage
    description: Create and manage authorized contextual project communications.

  - code: WORKFLOW_CONFIGURE
    resource: workflow
    action: configure
    description: Configure and publish governed workflow definitions.

roles:
  SYSTEM_ADMIN:
    description: Full platform administration.
    grants:
      - IDENTITY_MANAGE
      - WORKSPACE_CREATE
      - WORKSPACE_READ
      - WORKSPACE_MANAGE
      - ENTITY_CREATE
      - ENTITY_READ
      - ENTITY_UPDATE
      - ENTITY_ARCHIVE
      - RELATIONSHIP_MANAGE
      - METADATA_MANAGE
      - FORM_DESIGN
      - FORM_SUBMIT
      - DOCUMENT_UPLOAD
      - DOCUMENT_READ
      - DOCUMENT_ARCHIVE
      - IMPORT_EXECUTE
      - PHASE_MANAGE
      - PHASE_LOCK
      - PHASE_UNLOCK
      - REVIEW_MANAGE
      - DASHBOARD_READ
      - DASHBOARD_MANAGE
      - AUDIT_READ
      - DELIVERABLE_CONTRIBUTE
      - DELIVERABLE_INTERNAL_REVIEW
      - SUBMISSION_CREATE
      - PROJECT_MONITOR
      - PROJECT_REVIEW
      - PROJECT_RECOMMEND
      - TECHNICAL_REVIEW
      - TECHNICAL_SIGN_OFF
      - ACCEPTANCE_DECIDE
      - CONDITION_VERIFY
      - COMMUNICATION_MANAGE
      - WORKFLOW_CONFIGURE

  PROJECT_MANAGER:
    description: Workspace/project management and review.
    grants:
      - WORKSPACE_READ
      - ENTITY_CREATE
      - ENTITY_READ
      - ENTITY_UPDATE
      - RELATIONSHIP_MANAGE
      - FORM_SUBMIT
      - DOCUMENT_UPLOAD
      - DOCUMENT_READ
      - IMPORT_EXECUTE
      - PHASE_MANAGE
      - PHASE_LOCK
      - PHASE_UNLOCK
      - REVIEW_MANAGE
      - DASHBOARD_READ
      - DASHBOARD_MANAGE
      - AUDIT_READ
      - PROJECT_MONITOR
      - PROJECT_REVIEW
      - PROJECT_RECOMMEND
      - COMMUNICATION_MANAGE

  ANALYST:
    description: Structured data and document contribution.
    grants:
      - WORKSPACE_READ
      - ENTITY_CREATE
      - ENTITY_READ
      - ENTITY_UPDATE
      - RELATIONSHIP_MANAGE
      - FORM_SUBMIT
      - DOCUMENT_UPLOAD
      - DOCUMENT_READ
      - IMPORT_EXECUTE
      - DASHBOARD_READ
      - DELIVERABLE_CONTRIBUTE
      - COMMUNICATION_MANAGE

  VIEWER:
    description: Read-only access.
    grants:
      - WORKSPACE_READ
      - ENTITY_READ
      - DOCUMENT_READ
      - DASHBOARD_READ

  PROJECT_OFFICER:
    description: Project monitoring, completeness follow-up, and reporting.
    grants:
      - WORKSPACE_READ
      - ENTITY_READ
      - DOCUMENT_READ
      - DASHBOARD_READ
      - AUDIT_READ
      - PROJECT_MONITOR
      - COMMUNICATION_MANAGE

  TECHNICAL_REVIEWER:
    description: Independent technical assessment and configured sign-off.
    grants:
      - WORKSPACE_READ
      - ENTITY_READ
      - DOCUMENT_READ
      - DASHBOARD_READ
      - TECHNICAL_REVIEW
      - TECHNICAL_SIGN_OFF
      - COMMUNICATION_MANAGE

  CONTRACTOR_PROJECT_LEADER:
    description: Contractor-side execution, internal review, and formal submission.
    grants:
      - WORKSPACE_READ
      - ENTITY_CREATE
      - ENTITY_READ
      - ENTITY_UPDATE
      - FORM_SUBMIT
      - DOCUMENT_UPLOAD
      - DOCUMENT_READ
      - DASHBOARD_READ
      - DELIVERABLE_CONTRIBUTE
      - DELIVERABLE_INTERNAL_REVIEW
      - SUBMISSION_CREATE
      - PROJECT_MONITOR
      - COMMUNICATION_MANAGE

  CONTRACTOR_TEAM_MEMBER:
    description: Preparation and revision of assigned contractor work.
    grants:
      - WORKSPACE_READ
      - ENTITY_READ
      - ENTITY_UPDATE
      - FORM_SUBMIT
      - DOCUMENT_UPLOAD
      - DOCUMENT_READ
      - DASHBOARD_READ
      - DELIVERABLE_CONTRIBUTE
      - COMMUNICATION_MANAGE

  EMPLOYER_REPRESENTATIVE:
    description: Employer oversight and contractual acceptance authority.
    grants:
      - WORKSPACE_READ
      - ENTITY_READ
      - DOCUMENT_READ
      - DASHBOARD_READ
      - AUDIT_READ
      - PROJECT_MONITOR
      - ACCEPTANCE_DECIDE
      - CONDITION_VERIFY
      - COMMUNICATION_MANAGE
