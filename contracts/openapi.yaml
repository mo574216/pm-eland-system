  /submissions/{submissionId}/review-comments:
    post:
      tags: [Deliverables]
      operationId: createSubmissionReviewComment
      summary: Append a comment bound to the submitted immutable version
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewCommentCreate'}
      responses:
        '201':
          description: Version-bound review comment appended and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '423': {$ref: '#/components/responses/Locked'}

  /submissions/{submissionId}/review-outcomes:
    post:
      tags: [Deliverables]
      operationId: createSubmissionReviewOutcome
      summary: Record a version-bound project or technical review outcome
      parameters:
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewOutcomeCreate'}
      responses:
        '201':
          description: Immutable outcome recorded; revision outcomes transition the workflow
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '423': {$ref: '#/components/responses/Locked'}

  /phases/{phaseId}/acceptance-workspace:
    get:
      tags: [Acceptance]
      operationId: getPhaseAcceptanceWorkspace
      summary: Return phase acceptance packages and server-authorized actions
      parameters:
        - {name: phaseId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Acceptance workspace projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /phases/{phaseId}/acceptance-packages:
    post:
      tags: [Acceptance]
      operationId: createPhaseAcceptancePackage
      summary: Assemble immutable current submission and recommendation evidence
      parameters:
        - {name: phaseId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptancePackageCreate'}
      responses:
        '201': {description: Immutable acceptance package created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /acceptance-packages/{packageId}/decisions:
    post:
      tags: [Acceptance]
      operationId: createPhaseAcceptanceDecision
      summary: Record an employer accept, conditional accept, or reject decision
      parameters:
        - {name: packageId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptanceDecisionCreate'}
      responses:
        '201': {description: Immutable contractual decision recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /acceptance-conditions/{conditionId}/evidence:
    post:
      tags: [Acceptance]
      operationId: submitAcceptanceConditionEvidence
      summary: Submit immutable evidence for an assigned condition
      parameters:
        - {name: conditionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptanceConditionEvidenceCreate'}
      responses:
        '201': {description: Evidence submitted for verification}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /acceptance-conditions/{conditionId}/verification:
    post:
      tags: [Acceptance]
      operationId: verifyAcceptanceCondition
      summary: Verify or reject submitted condition evidence
      parameters:
        - {name: conditionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptanceConditionVerificationCreate'}
      responses:
        '200': {description: Condition verification recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /acceptance-decisions/{decisionId}/closure:
    post:
      tags: [Acceptance]
      operationId: closeConditionalAcceptance
      summary: Close a conditional acceptance after mandatory conditions are satisfied
      parameters:
        - {name: decisionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptanceClosureCreate'}
      responses:
        '201': {description: Conditional acceptance closure recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspaceId}/dashboard-summary:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Dashboards]
      operationId: getDashboardSummary
      summary: Return safe server-defined workspace KPIs
      responses:
        '200':
          description: Entity, document, phase, and deliverable KPI summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /workspaces/{workspaceId}/audit:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Audit]
      operationId: getWorkspaceAuditHistory
      summary: List authorized, read-only workspace audit history
      parameters:
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string, format: uuid}}
        - {name: user_id, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Reverse-chronological audit history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /workspaces/{workspaceId}/workflow-definitions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workflows]
      operationId: createWorkflowDefinition
      summary: Create a validated draft workflow graph
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowDefinitionCreate'}
      responses:
        '201':
          description: Draft definition and version created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /workflow-definition-versions/{versionId}/publish:
    post:
      tags: [Workflows]
      operationId: publishWorkflowDefinitionVersion
      summary: Publish an immutable workflow definition version
      parameters:
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Published definition version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workflow-definitions/{definitionId}/versions:
    post:
      tags: [Workflows]
      operationId: createWorkflowDefinitionVersion
      summary: Create a successor draft version with optimistic concurrency
      parameters:
        - {name: definitionId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowDefinitionVersionCreate'}
      responses:
        '201':
          description: Successor draft definition version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /workspaces/{workspaceId}/workflow-instances:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workflows]
      operationId: startWorkflowInstance
      summary: Start a workflow instance for an allowlisted workspace target
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowInstanceCreate'}
      responses:
        '201':
          description: Workflow instance and authorized next actions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workflow-instances/{instanceId}:
    get:
      tags: [Workflows]
      operationId: getWorkflowInstance
      summary: Retrieve current workflow state and authorized action hints
      parameters:
        - {name: instanceId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current workflow projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workflow-instances/{instanceId}/history:
    get:
      tags: [Workflows]
      operationId: getWorkflowTransitionHistory
      summary: List append-only version-bound transition history
      parameters:
        - {name: instanceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200':
          description: Reverse-chronological transition events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workflow-instances/{instanceId}/actions/{actionKey}:
    post:
      tags: [Workflows]
      operationId: transitionWorkflowInstance
      summary: Execute one permission and assignment-bound transition
      parameters:
        - {name: instanceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: actionKey, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowTransitionRequest'}
      responses:
        '200':
          description: Resulting state and newly authorized action hints
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuccessEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get background job state
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EntityTypeId:
      name: entityTypeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EntityId:
      name: entityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    FormId:
      name: formId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImportJobId:
      name: importJobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PhaseId:
      name: phaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    ImportMappingInput:
      type: object
      additionalProperties: false
      required: [source_column]
      properties:
        source_sheet: {type: [string, 'null'], minLength: 1, maxLength: 255}
        source_column: {type: string, minLength: 1, maxLength: 255}
        target_attribute_definition_id: {type: [string, 'null'], format: uuid}
        target_system_field:
          type: [string, 'null']
          enum: [name, description, parent_id, null]
        transformation_config: {type: object, additionalProperties: true}
        display_order: {type: integer, minimum: 0, default: 0}
      description: Exactly one target field must be supplied.

    AttributeMatchKey:
      type: object
      additionalProperties: false
      required: [source_column]
      properties:
        source_sheet: {type: [string, 'null'], minLength: 1, maxLength: 255}
        source_column: {type: string, minLength: 1, maxLength: 255}
        attribute_definition_id: {type: [string, 'null'], format: uuid}
        system_field: {type: [string, 'null'], enum: [name, null]}
      description: Exactly one target must be supplied.

    ImportMatchingStrategy:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, source_column]
          properties:
            type: {const: ENTITY_ID}
            source_sheet: {type: [string, 'null'], minLength: 1, maxLength: 255}
            source_column: {type: string, minLength: 1, maxLength: 255}
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type: {const: UNIQUE_ATTRIBUTE}
            key: {$ref: '#/components/schemas/AttributeMatchKey'}
        - type: object
          additionalProperties: false
          required: [type, keys]
          properties:
            type: {const: COMPOSITE_KEY}
            keys:
              type: array
              minItems: 2
              maxItems: 10
              items: {$ref: '#/components/schemas/AttributeMatchKey'}
        - type: object
          additionalProperties: false
          required: [type, parent_source_column, key]
          properties:
            type: {const: PARENT_AND_KEY}
            parent_source_sheet: {type: [string, 'null'], minLength: 1, maxLength: 255}
            parent_source_column: {type: string, minLength: 1, maxLength: 255}
            key: {$ref: '#/components/schemas/AttributeMatchKey'}
      discriminator:
        propertyName: type

    ImportProfileCreate:
      type: object
      additionalProperties: false
      required: [entity_type_id, name, source_type, matching_strategy]
      properties:
        entity_type_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        source_type: {type: string, enum: [XLSX, CSV]}
        matching_strategy: {$ref: '#/components/schemas/ImportMatchingStrategy'}
        configuration: {type: object, additionalProperties: true}
        mappings:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/ImportMappingInput'}

    ImportProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        configuration: {type: object, additionalProperties: true}
        matching_strategy: {$ref: '#/components/schemas/ImportMatchingStrategy'}
        mappings:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/ImportMappingInput'}

    ImportProfileAssignment:
      type: object
      additionalProperties: false
      required: [import_profile_id]
      properties:
        import_profile_id: {type: string, format: uuid}

    ImportConflictResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution]
      properties:
        resolution: {type: string, enum: [MERGE, REPLACE, SKIP]}

    ImportBulkResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution, conflict_ids]
      properties:
        resolution: {type: string, enum: [MERGE, REPLACE, SKIP]}
        conflict_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: {type: string, format: uuid}

    ErrorObject:
      type: object
      description: >
        Stable English machine code with a safe Persian (`fa-IR`) user-facing
        message. Clients branch on code and must not branch on translated text.
      properties:
        code:
          type: string
          example: RESOURCE_LOCKED
        message:
          type: string
          example: این مورد در مرحله قفل‌شده قرار دارد و قابل ویرایش نیست.
        details: {}
      required: [code, message]

    SuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          const: true
        data: {}
        error:
          type: 'null'
        meta:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 1}

    RoleAssignmentRequest:
      type: object
      required: [role_code]
      additionalProperties: false
      properties:
        role_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'

    WorkspaceCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        slug: {type: string, minLength: 1, maxLength: 160}
        description: {type: string}

    WorkspaceUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [description]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        version: {type: integer, minimum: 1}

    WorkspaceMemberCreate:
      type: object
      required: [user_id, role_id]
      additionalProperties: false
      properties:
        user_id: {type: string, format: uuid}
        role_id: {type: string, format: uuid}

    WorkspacePersonOption:
      type: object
      required: [id, username, display_name]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: [string, 'null']}

    WorkspaceRoleOption:
      type: object
      required: [id, code, name, description]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}

    PhaseCreate:
      type: object
      required: [name, sequence_number]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
          description: Optional advanced stable key; generated by the server when omitted.
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        sequence_number: {type: integer, minimum: 1}

    PhaseUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [description]
        - required: [sequence_number]
        - required: [status]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        sequence_number: {type: integer, minimum: 1}
        status:
          type: string
          enum: [PLANNED, IN_PROGRESS, COMPLETED, ARCHIVED]
        version: {type: integer, minimum: 1}

    EntityTypeCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Optional advanced stable key; generated by the server when omitted.
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        name: {type: string, minLength: 1, maxLength: 180}
        plural_name: {type: string, maxLength: 180}
        description: {type: string}
        configuration:
          type: object
          additionalProperties: true

    EntityTypeUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [plural_name]
        - required: [description]
        - required: [configuration]
      properties:
        name: {type: string, minLength: 1, maxLength: 180}
        plural_name: {type: [string, 'null'], maxLength: 180}
        description: {type: [string, 'null']}
        configuration:
          type: object
          additionalProperties: true
        version: {type: integer, minimum: 1}

    AttributeCreate:
      type: object
      required: [label, data_type]
      additionalProperties: false
      properties:
        key:
          type: string
          description: Optional advanced stable key; generated by the server when omitted.
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        label: {type: string, minLength: 1, maxLength: 180}
        description: {type: [string, 'null']}
        data_type:
          type: string
          enum:
            - TEXT
            - RICH_TEXT
            - INTEGER
            - DECIMAL
            - BOOLEAN
            - DATE
            - DATETIME
            - ENUM
            - MULTI_ENUM
            - USER_REFERENCE
            - ENTITY_REFERENCE
            - FILE_REFERENCE
            - JSON
            - TABLE
        is_required: {type: boolean, default: false}
        is_read_only: {type: boolean, default: false}
        default_value: {}
        validation_config:
          type: object
          additionalProperties: true
        display_config:
          type: object
          additionalProperties: true
        inheritance_config:
          type: object
          additionalProperties: true
        display_order: {type: integer, minimum: 0, default: 0}

    AttributeUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [label]
        - required: [description]
        - required: [is_required]
        - required: [is_read_only]
        - required: [default_value]
        - required: [validation_config]
        - required: [display_config]
        - required: [inheritance_config]
        - required: [display_order]
      properties:
        label: {type: string, minLength: 1, maxLength: 180}
        description: {type: [string, 'null']}
        is_required: {type: boolean}
        is_read_only: {type: boolean}
        default_value: {}
        validation_config: {type: object, additionalProperties: true}
        display_config: {type: object, additionalProperties: true}
        inheritance_config: {type: object, additionalProperties: true}
        display_order: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}

    EntityCreate:
      type: object
      required: [entity_type_id, name]
      additionalProperties: false
      properties:
        entity_type_id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        attributes:
          type: object
          additionalProperties: true

    EntityUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [description]
        - required: [attributes]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        attributes:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1

    EntityTreeTypeSummary:
      type: object
      required: [id, key, name, icon_key]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        icon_key: {type: [string, 'null']}

    EntityTreeNode:
      type: object
      required:
        - id
        - workspace_id
        - entity_type_id
        - entity_type
        - parent_id
        - name
        - status
        - depth
        - path
        - has_children
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        entity_type_id: {type: string, format: uuid}
        entity_type:
          oneOf:
            - $ref: '#/components/schemas/EntityTreeTypeSummary'
            - type: 'null'
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        status: {type: string, enum: [ACTIVE, ARCHIVED]}
        depth: {type: integer, minimum: 0}
        path:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
        has_children: {type: boolean}

    EntityTreeData:
      type: object
      required: [items, root_id, depth]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityTreeNode'
        root_id: {type: [string, 'null'], format: uuid}
        depth: {type: [integer, 'null'], minimum: 1}

    EntityParentUpdate:
      type: object
      required: [parent_id, version]
      additionalProperties: false
      properties:
        parent_id: {type: [string, 'null'], format: uuid}
        version: {type: integer, minimum: 1}

    RelationshipTypeCreate:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        name: {type: string, minLength: 1, maxLength: 180}
        description: {type: [string, 'null']}
        directionality: {type: string, enum: [DIRECTED, UNDIRECTED], default: DIRECTED}
        source_type_id: {type: [string, 'null'], format: uuid}
        target_type_id: {type: [string, 'null'], format: uuid}
        configuration:
          type: object
          description: Set allow_duplicates to false to reject active duplicate endpoint pairs.
          additionalProperties: true

    RelationshipTypeResponse:
      type: object
      required: [id, workspace_id, key, name, directionality, configuration, is_active, created_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        directionality: {type: string, enum: [DIRECTED, UNDIRECTED]}
        source_type_id: {type: [string, 'null'], format: uuid}
        target_type_id: {type: [string, 'null'], format: uuid}
        configuration: {type: object, additionalProperties: true}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}

    RelationshipCreate:
      type: object
      required: [relationship_type_id, source_entity_id, target_entity_id]
      additionalProperties: false
      properties:
        relationship_type_id: {type: string, format: uuid}
        source_entity_id: {type: string, format: uuid}
        target_entity_id: {type: string, format: uuid}
        attributes:
          type: object
          additionalProperties: true

    RelationshipResponse:
      type: object
      required:
        - id
        - workspace_id
        - relationship_type_id
        - source_entity_id
        - target_entity_id
        - attributes
        - created_at
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        relationship_type_id: {type: string, format: uuid}
        source_entity_id: {type: string, format: uuid}
        target_entity_id: {type: string, format: uuid}
        attributes: {type: object, additionalProperties: true}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}

    FormCreate:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        name: {type: string, minLength: 1, maxLength: 255}
        entity_type_id: {type: [string, 'null'], format: uuid}
        description: {type: [string, 'null']}

    FormSectionDefinition:
      type: object
      required: [key, label]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        label: {type: string, minLength: 1, maxLength: 180}
        display_order: {type: integer, minimum: 0, default: 0}
        configuration: {type: object, additionalProperties: true}

    FormSchemaDefinition:
      type: object
      additionalProperties: false
      properties:
        sections:
          type: array
          items: {$ref: '#/components/schemas/FormSectionDefinition'}

    FormUpdate:
      type: object
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [entity_type_id]
        - required: [description]
        - required: [schema_json]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        entity_type_id: {type: [string, 'null'], format: uuid}
        description: {type: [string, 'null']}
        schema_json: {$ref: '#/components/schemas/FormSchemaDefinition'}

    FormFieldCreate:
      type: object
      required: [key, label, field_type]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        label: {type: string, minLength: 1, maxLength: 180}
        field_type:
          type: string
          enum: [TEXT, RICH_TEXT, INTEGER, DECIMAL, BOOLEAN, DATE, DATETIME, ENUM, MULTI_ENUM, USER_REFERENCE, ENTITY_REFERENCE, FILE_REFERENCE, TABLE]
        attribute_definition_id: {type: [string, 'null'], format: uuid}
        section_key:
          type: [string, 'null']
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        display_order: {type: integer, minimum: 0, default: 0}
        is_required: {type: boolean, default: false}
        is_read_only: {type: boolean, default: false}
        configuration: {type: object, additionalProperties: true}
        visibility_rule: {type: object, additionalProperties: true}
        validation_rule: {type: object, additionalProperties: true}
        inheritance_rule: {type: object, additionalProperties: true}

    FormRenderSummary:
      type: object
      required: [id, key, name, version_number, lifecycle_status]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        version_number: {type: integer, minimum: 1}
        lifecycle_status: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}

    FormRenderField:
      type: object
      required: [key, label, type, required, read_only, visible, value, has_value, value_source, configuration, visibility_rule, validation_rule]
      additionalProperties: false
      properties:
        key: {type: string}
        label: {type: string}
        type:
          type: string
          enum: [TEXT, RICH_TEXT, INTEGER, DECIMAL, BOOLEAN, DATE, DATETIME, ENUM, MULTI_ENUM, USER_REFERENCE, ENTITY_REFERENCE, FILE_REFERENCE, TABLE]
        required: {type: boolean}
        read_only: {type: boolean}
        visible: {type: boolean}
        value: {}
        has_value: {type: boolean}
        value_source: {type: string, enum: [CURRENT, INHERITED, DEFAULT, NONE]}
        configuration: {type: object, additionalProperties: true}
        visibility_rule: {type: object, additionalProperties: true}
        validation_rule: {type: object, additionalProperties: true}

    FormRenderSection:
      type: object
      required: [key, label, order, configuration, fields]
      additionalProperties: false
      properties:
        key: {type: [string, 'null']}
        label: {type: [string, 'null']}
        order: {type: integer, minimum: 0}
        configuration: {type: object, additionalProperties: true}
        fields:
          type: array
          items: {$ref: '#/components/schemas/FormRenderField'}

    FormRenderResponse:
      type: object
      required: [form, entity_id, sections]
      additionalProperties: false
      properties:
        form: {$ref: '#/components/schemas/FormRenderSummary'}
        entity_id: {type: [string, 'null'], format: uuid}
        sections:
          type: array
          items: {$ref: '#/components/schemas/FormRenderSection'}

    FormInstanceCreate:
      type: object
      required: [entity_id]
      additionalProperties: false
      properties:
        entity_id: {type: string, format: uuid}

    FormInstanceUpdate:
      type: object
      required: [values, version]
      additionalProperties: false
      properties:
        values: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}

    FormInstanceResponse:
      type: object
      required: [id, workspace_id, form_definition_id, entity_id, status, values, version, created_at, updated_at, submitted_by, submitted_at, form]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        form_definition_id: {type: string, format: uuid}
        entity_id: {type: string, format: uuid}
        status: {type: string, enum: [DRAFT, SUBMITTED, APPROVED, REVISION_REQUESTED]}
        values: {type: object, additionalProperties: true}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        submitted_by: {type: [string, 'null'], format: uuid}
        submitted_at: {type: [string, 'null'], format: date-time}
        form: {$ref: '#/components/schemas/FormRenderSummary'}

    DeliverableRequirement:
      type: object
      additionalProperties: false
      required: [key, label, resource_kind]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 120}
        label: {type: string, minLength: 1, maxLength: 255}
        resource_kind: {type: string, enum: [ENTITY, DOCUMENT_VERSION, FORM_INSTANCE]}
        required: {type: boolean, default: true}

    DeliverableCreate:
      type: object
      additionalProperties: false
      required: [name, owner_id, internal_reviewer_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null'], maxLength: 5000}
        owner_id: {type: string, format: uuid}
        contributor_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
        internal_reviewer_id: {type: [string, 'null'], format: uuid}
        internal_due_at: {type: [string, 'null'], format: date-time}
        official_due_at: {type: [string, 'null'], format: date-time}
        requirements:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/DeliverableRequirement'}

    DeliverablePackageItemCreate:
      type: object
      additionalProperties: false
      required: [resource_kind, resource_id]
      properties:
        resource_kind: {type: string, enum: [ENTITY, DOCUMENT_VERSION, FORM_INSTANCE]}
        resource_id: {type: string, format: uuid}
        requirement_key: {type: [string, 'null'], maxLength: 120}

    DeliverableVersionCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        summary: {type: [string, 'null'], maxLength: 5000}
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/DeliverablePackageItemCreate'}

    SubmissionCreate:
      type: object
      additionalProperties: false
      required: [deliverable_version_id, statement, recipient_ids, idempotency_key]
      properties:
        deliverable_version_id: {type: string, format: uuid}
        statement: {type: string, minLength: 1, maxLength: 10000}
        recipient_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, format: uuid}
        related_comment_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
        prior_submission_id: {type: [string, 'null'], format: uuid}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    SubmissionWithdrawalCreate:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        reason: {type: string, minLength: 1, maxLength: 5000}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    ReviewCommentCreate:
      type: object
      additionalProperties: false
      required: [text, idempotency_key]
      properties:
        text: {type: string, minLength: 1, maxLength: 10000}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    ReviewOutcomeCreate:
      type: object
      additionalProperties: false
      required: [outcome_kind, authority_kind, statement, idempotency_key]
      properties:
        outcome_kind:
          type: string
          enum: [CLARIFICATION, REVISION_REQUEST, RECOMMENDATION, CONDITIONAL_RECOMMENDATION, REJECTION_MAJOR_REVISION, TECHNICAL_SIGN_OFF]
        authority_kind: {type: string, enum: [PROJECT_REVIEW, TECHNICAL_REVIEW]}
        statement: {type: string, minLength: 1, maxLength: 10000}
        conditions:
          type: array
          maxItems: 100
          items: {type: string}
        related_comment_ids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
        expected_workflow_version: {type: [integer, 'null'], minimum: 1}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    AcceptancePackageCreate:
      type: object
      additionalProperties: false
      required: [employer_recipient_id, statement, idempotency_key]
      properties:
        employer_recipient_id: {type: string, format: uuid}
        statement: {type: string, minLength: 1, maxLength: 10000}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    AcceptanceConditionCreate:
      type: object
      additionalProperties: false
      required: [description, responsible_id, verifier_id, due_at, evidence_requirement]
      properties:
        description: {type: string, minLength: 1, maxLength: 5000}
        responsible_id: {type: string, format: uuid}
        verifier_id: {type: string, format: uuid}
        due_at: {type: string, format: date-time}
        evidence_requirement: {type: string, minLength: 1, maxLength: 5000}
        mandatory: {type: boolean, default: true}

    AcceptanceDecisionCreate:
      type: object
      additionalProperties: false
      required: [decision_kind, statement, idempotency_key]
      properties:
        decision_kind: {type: string, enum: [ACCEPT, CONDITIONAL_ACCEPT, REJECT]}
        statement: {type: string, minLength: 1, maxLength: 10000}
        conditions:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AcceptanceConditionCreate'}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    AcceptanceEvidenceItem:
      type: object
      additionalProperties: false
      required: [resource_kind, resource_id]
      properties:
        resource_kind: {type: string, enum: [ENTITY, DOCUMENT_VERSION, FORM_INSTANCE]}
        resource_id: {type: string, format: uuid}

    AcceptanceConditionEvidenceCreate:
      type: object
      additionalProperties: false
      required: [expected_version, statement, evidence, idempotency_key]
      properties:
        expected_version: {type: integer, minimum: 1}
        statement: {type: string, minLength: 1, maxLength: 10000}
        evidence:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/AcceptanceEvidenceItem'}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    AcceptanceConditionVerificationCreate:
      type: object
      additionalProperties: false
      required: [expected_version, decision, statement, idempotency_key]
      properties:
        expected_version: {type: integer, minimum: 1}
        decision: {type: string, enum: [VERIFY, REJECT_EVIDENCE]}
        statement: {type: string, minLength: 1, maxLength: 10000}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    AcceptanceClosureCreate:
      type: object
      additionalProperties: false
      required: [statement, idempotency_key]
      properties:
        statement: {type: string, minLength: 1, maxLength: 10000}
        idempotency_key: {type: string, minLength: 1, maxLength: 255}

    WorkflowStateCreate:
      type: object
      additionalProperties: false
      required: [key, label, sequence_number]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 120}
        label: {type: string, minLength: 1, maxLength: 255}
        sequence_number: {type: integer, minimum: 1}
        is_initial: {type: boolean, default: false}
        is_terminal: {type: boolean, default: false}

    WorkflowTransitionCreate:
      type: object
      additionalProperties: false
      required: [key, label, from_state_key, to_state_key, required_permission, authority_kind]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 120}
        label: {type: string, minLength: 1, maxLength: 255}
        from_state_key: {type: string}
        to_state_key: {type: string}
        required_permission: {type: string, description: Stable code from permissions.yaml}
        authority_kind: {type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 80}
        assignment_kind: {type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 80}
        reason_required: {type: boolean, default: false}

    WorkflowDefinitionCreate:
      type: object
      additionalProperties: false
      required: [name, states, transitions]
      properties:
        key: {type: [string, 'null'], pattern: '^[a-z][a-z0-9_]*$', maxLength: 120}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        states:
          type: array
          minItems: 2
          maxItems: 50
          items: {$ref: '#/components/schemas/WorkflowStateCreate'}
        transitions:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/WorkflowTransitionCreate'}

    WorkflowDefinitionVersionCreate:
      type: object
      additionalProperties: false
      required: [expected_version, states, transitions]
      properties:
        expected_version: {type: integer, minimum: 1}
        states:
          type: array
          minItems: 2
          maxItems: 50
          items: {$ref: '#/components/schemas/WorkflowStateCreate'}
        transitions:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/WorkflowTransitionCreate'}

    WorkflowAssignmentCreate:
      type: object
      additionalProperties: false
      required: [user_id, assignment_kind]
      properties:
        user_id: {type: string, format: uuid}
        assignment_kind: {type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 80}

    WorkflowInstanceCreate:
      type: object
      additionalProperties: false
      required: [definition_version_id, target_kind, target_id, idempotency_key]
      properties:
        definition_version_id: {type: string, format: uuid}
        target_kind: {type: string, enum: [ENTITY, DOCUMENT, FORM_INSTANCE, PHASE, DELIVERABLE]}
        target_id: {type: string, format: uuid}
        target_version: {type: [integer, 'null'], minimum: 1}
        assignments:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/WorkflowAssignmentCreate'}
        idempotency_key: {type: string, minLength: 8, maxLength: 255}

    WorkflowTransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, idempotency_key]
      properties:
        expected_version: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 8, maxLength: 255}
        reason: {type: [string, 'null'], maxLength: 4000}
        target_version: {type: [integer, 'null'], minimum: 1}

  responses:
    NotFound:
      description: Resource not found or not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Effective permission is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request or metadata validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Locked:
      description: Resource locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
