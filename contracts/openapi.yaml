openapi: 3.1.0
info:
  title: Metadata-Driven Enterprise Architecture Platform API
  version: 1.0.0
  description: >
    Core public REST contract for the platform. This file is intentionally a
    foundational implementation contract and SHALL be expanded alongside
    backend implementation without breaking existing documented semantics.
    Developer-facing identifiers remain English; string values may be Persian,
    and safe error messages use Persian (`fa-IR`) for the Persian-first MVP.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Workspaces
  - name: Metadata
  - name: Entities
  - name: Relationships
  - name: Forms
  - name: Documents
  - name: Imports
  - name: Phases
  - name: Reviews
  - name: Dashboards
  - name: Audit
  - name: Jobs

paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      servers:
        - url: /
      operationId: getLiveness
      summary: Report process viability
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /health/ready:
    get:
      tags: [Health]
      security: []
      servers:
        - url: /
      operationId: getReadiness
      summary: Report critical dependency readiness
      responses:
        '200':
          description: Service is ready
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '503':
          description: A critical dependency is unavailable
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refreshSession
      summary: Rotate refresh session and issue an access token
      responses:
        '200':
          description: Session refreshed; a rotated HttpOnly refresh cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Refresh session missing, invalid, expired, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh-session family
      responses:
        '204':
          description: Session revoked and refresh cookie cleared

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return authenticated user context
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{userId}/roles:
    post:
      tags: [Identity]
      operationId: assignUserRole
      summary: Assign a global role to a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Role assignment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/roles/{roleCode}:
    delete:
      tags: [Identity]
      operationId: removeUserRole
      summary: Remove a global role from a user
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: roleCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
      responses:
        '204':
          description: Role removed or already absent
        '403':
          $ref: '#/components/responses/Forbidden'

  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List accessible workspaces
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 255}
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Retrieve an accessible workspace
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update mutable workspace fields with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List safe member display details for an accessible workspace
      responses:
        '200':
          description: Workspace member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      summary: Add a user with a workspace-level role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberCreate'
      responses:
        '201':
          description: Workspace member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a user from a workspace
      responses:
        '204':
          description: Workspace member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workspaces/{workspaceId}/member-options:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: searchWorkspaceMemberOptions
      summary: Search active non-members for an authorized workspace member selector
      parameters:
        - name: search
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 120}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 10}
      responses:
        '200':
          description: Bounded person options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workspaces/{workspaceId}/role-options:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceRoleOptions
      summary: List roles whose permissions the acting manager may assign
      responses:
        '200':
          description: Assignable role options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /workspaces/{workspaceId}/entity-types:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Metadata]
      operationId: listEntityTypes
      summary: List entity types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: active
          in: query
          schema: {type: boolean}
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 180}
      responses:
        '200':
          description: Entity type list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Metadata]
      operationId: createEntityType
      summary: Create metadata-defined entity type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypeCreate'
      responses:
        '201':
          description: Entity type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /entity-types/{entityTypeId}:
    parameters:
      - $ref: '#/components/parameters/EntityTypeId'
    get:
      tags: [Metadata]
      operationId: getEntityType
      summary: Retrieve an accessible entity type
      responses:
        '200':
          description: Entity type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Metadata]
      operationId: updateEntityType
      summary: Update mutable entity-type metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypeUpdate'
      responses:
        '200':
          description: Updated entity type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Metadata]
      operationId: archiveEntityType
      summary: Logically archive an entity type
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Entity type archived
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /entity-types/{entityTypeId}/attributes:
    parameters:
      - $ref: '#/components/parameters/EntityTypeId'
    get:
      tags: [Metadata]
      operationId: listAttributes
      summary: List entity type attributes
      responses:
        '200':
          description: Attribute list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Metadata]
      operationId: createAttribute
      summary: Create attribute definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeCreate'
      responses:
        '201':
          description: Attribute created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attributes/{attributeId}:
    parameters:
      - name: attributeId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Metadata]
      operationId: updateAttribute
      summary: Update mutable attribute metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeUpdate'
      responses:
        '200':
          description: Updated attribute definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Metadata]
      operationId: deactivateAttribute
      summary: Logically deactivate an attribute definition
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Attribute definition deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/entities:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Entities]
      operationId: listEntities
      summary: List/search entities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: status
          in: query
          schema: {type: string, enum: [ACTIVE, ARCHIVED]}
        - name: entity_type_id
          in: query
          schema: {type: string, format: uuid}
        - name: parent_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Entity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Entities]
      operationId: createEntity
      summary: Create generic entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreate'
      responses:
        '201':
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /entities/{entityId}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Entities]
      operationId: getEntity
      summary: Retrieve entity
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Entities]
      operationId: updateEntity
      summary: Update entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
    delete:
      tags: [Entities]
      operationId: archiveEntity
      summary: Logically archive an entity
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Entity archived
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/entities/tree:
    get:
      tags: [Entities]
      operationId: getEntityTree
      summary: Retrieve hierarchy
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: root_id
          in: query
          schema: {type: string, format: uuid}
        - name: depth
          in: query
          schema: {type: integer, minimum: 1}
        - name: include_type
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Hierarchy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EntityTreeData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /entities/{entityId}/parent:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    patch:
      tags: [Entities]
      operationId: reparentEntity
      summary: Move an entity within its workspace hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityParentUpdate'
      responses:
        '200':
          description: Entity reparented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '423':
          $ref: '#/components/responses/Locked'

  /workspaces/{workspaceId}/relationship-types:
    post:
      tags: [Relationships]
      operationId: createRelationshipType
      summary: Create relationship metadata
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipTypeCreate'
      responses:
        '201':
          description: Relationship type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    get:
      tags: [Relationships]
      operationId: listRelationshipTypes
      summary: List active relationship types
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Relationship type page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}

  /workspaces/{workspaceId}/relationships:
    post:
      tags: [Relationships]
      operationId: createRelationship
      summary: Create entity relationship
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreate'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /entities/{entityId}/relationships:
    get:
      tags: [Relationships]
      operationId: listEntityRelationships
      summary: List incoming and outgoing relationships for an entity
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - name: direction
          in: query
          schema: {type: string, enum: [incoming, outgoing, both], default: both}
        - name: relationship_type_id
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Relationship page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /relationships/{relationshipId}:
    delete:
      tags: [Relationships]
      operationId: deleteRelationship
      summary: Logically delete an entity relationship
      parameters:
        - name: relationshipId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Relationship deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /workspaces/{workspaceId}/forms:
    post:
      tags: [Forms]
      operationId: createForm
      summary: Create draft form definition
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormCreate'
      responses:
        '201':
          description: Form created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    get:
      tags: [Forms]
      operationId: listForms
      summary: List form definitions
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: entity_type_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 255}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Form definition page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}

  /forms/{formId}:
    get:
      tags: [Forms]
      operationId: getForm
      summary: Retrieve a full form definition
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '200':
          description: Form definition with fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Forms]
      operationId: updateDraftForm
      summary: Update draft form metadata and sections
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormUpdate'
      responses:
        '200':
          description: Draft form updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /forms/{formId}/fields:
    post:
      tags: [Forms]
      operationId: addDraftFormField
      summary: Add metadata-defined field to a draft form
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
