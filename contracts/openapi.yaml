openapi: 3.1.0
info:
  title: Metadata-Driven Enterprise Architecture Platform API
  version: 1.0.0
  description: >
    Core public REST contract for the platform. This file is intentionally a
    foundational implementation contract and SHALL be expanded alongside
    backend implementation without breaking existing documented semantics.
    Developer-facing identifiers remain English; string values may be Persian,
    and safe error messages use Persian (`fa-IR`) for the Persian-first MVP.
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Workspaces
  - name: Metadata
  - name: Entities
  - name: Relationships
  - name: Forms
  - name: Documents
  - name: Imports
  - name: Phases
  - name: Reviews
  - name: Dashboards
  - name: Audit
  - name: Jobs

paths:
  /health/live:
    get:
      tags: [Health]
      security: []
      servers:
        - url: /
      operationId: getLiveness
      summary: Report process viability
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /health/ready:
    get:
      tags: [Health]
      security: []
      servers:
        - url: /
      operationId: getReadiness
      summary: Report critical dependency readiness
      responses:
        '200':
          description: Service is ready
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '503':
          description: A critical dependency is unavailable
          headers:
            X-Request-ID:
              schema: {type: string, format: uuid}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refreshSession
      summary: Rotate refresh session and issue an access token
      responses:
        '200':
          description: Session refreshed; a rotated HttpOnly refresh cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Refresh session missing, invalid, expired, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh-session family
      responses:
        '204':
          description: Session revoked and refresh cookie cleared

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return authenticated user context
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /users/{userId}/roles:
    post:
      tags: [Identity]
      operationId: assignUserRole
      summary: Assign a global role to a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Role assignment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/roles/{roleCode}:
    delete:
      tags: [Identity]
      operationId: removeUserRole
      summary: Remove a global role from a user
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: roleCode
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
      responses:
        '204':
          description: Role removed or already absent
        '403':
          $ref: '#/components/responses/Forbidden'

  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List accessible workspaces
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 255}
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Retrieve an accessible workspace
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update mutable workspace fields with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List members of an accessible workspace
      responses:
        '200':
          description: Workspace member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Workspaces]
      operationId: addWorkspaceMember
      summary: Add a user with a workspace-level role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceMemberCreate'
      responses:
        '201':
          description: Workspace member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a user from a workspace
      responses:
        '204':
          description: Workspace member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /workspaces/{workspaceId}/entity-types:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Metadata]
      operationId: listEntityTypes
      summary: List entity types
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: active
          in: query
          schema: {type: boolean}
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 180}
      responses:
        '200':
          description: Entity type list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Metadata]
      operationId: createEntityType
      summary: Create metadata-defined entity type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypeCreate'
      responses:
        '201':
          description: Entity type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /entity-types/{entityTypeId}:
    parameters:
      - $ref: '#/components/parameters/EntityTypeId'
    get:
      tags: [Metadata]
      operationId: getEntityType
      summary: Retrieve an accessible entity type
      responses:
        '200':
          description: Entity type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Metadata]
      operationId: updateEntityType
      summary: Update mutable entity-type metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityTypeUpdate'
      responses:
        '200':
          description: Updated entity type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Metadata]
      operationId: archiveEntityType
      summary: Logically archive an entity type
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Entity type archived
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /entity-types/{entityTypeId}/attributes:
    parameters:
      - $ref: '#/components/parameters/EntityTypeId'
    get:
      tags: [Metadata]
      operationId: listAttributes
      summary: List entity type attributes
      responses:
        '200':
          description: Attribute list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Metadata]
      operationId: createAttribute
      summary: Create attribute definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeCreate'
      responses:
        '201':
          description: Attribute created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /attributes/{attributeId}:
    parameters:
      - name: attributeId
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Metadata]
      operationId: updateAttribute
      summary: Update mutable attribute metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeUpdate'
      responses:
        '200':
          description: Updated attribute definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Metadata]
      operationId: deactivateAttribute
      summary: Logically deactivate an attribute definition
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Attribute definition deactivated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/entities:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Entities]
      operationId: listEntities
      summary: List/search entities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 255}
        - name: status
          in: query
          schema: {type: string, enum: [ACTIVE, ARCHIVED]}
        - name: entity_type_id
          in: query
          schema: {type: string, format: uuid}
        - name: parent_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Entity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Entities]
      operationId: createEntity
      summary: Create generic entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreate'
      responses:
        '201':
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /entities/{entityId}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Entities]
      operationId: getEntity
      summary: Retrieve entity
      responses:
        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Entities]
      operationId: updateEntity
      summary: Update entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
    delete:
      tags: [Entities]
      operationId: archiveEntity
      summary: Logically archive an entity
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '204':
          description: Entity archived
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /workspaces/{workspaceId}/entities/tree:
    get:
      tags: [Entities]
      operationId: getEntityTree
      summary: Retrieve hierarchy
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: root_id
          in: query
          schema: {type: string, format: uuid}
        - name: depth
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /workspaces/{workspaceId}/relationships:
    post:
      tags: [Relationships]
      operationId: createRelationship
      summary: Create entity relationship
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreate'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /workspaces/{workspaceId}/forms:
    post:
      tags: [Forms]
      operationId: createForm
      summary: Create draft form definition
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormCreate'
      responses:
        '201':
          description: Form created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /forms/{formId}/render:
    get:
      tags: [Forms]
      operationId: renderForm
      summary: Return normalized form render contract
      parameters:
        - $ref: '#/components/parameters/FormId'
        - name: entity_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Render contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /entities/{entityId}/documents:
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Create logical document with first version
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                description:
                  type: string
                document_type:
                  type: string
      responses:
        '202':
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /workspaces/{workspaceId}/imports:
    post:
      tags: [Imports]
      operationId: createImportJob
      summary: Upload import file and create job
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                import_profile_id:
                  type: string
                  format: uuid
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /imports/{importJobId}/dry-run:
    post:
      tags: [Imports]
      operationId: dryRunImport
      summary: Validate and preview import without canonical mutation
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
      responses:
        '200':
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /imports/{importJobId}/commit:
    post:
      tags: [Imports]
      operationId: commitImport
      summary: Commit reviewed import transactionally
      parameters:
        - $ref: '#/components/parameters/ImportJobId'
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      responses:
        '202':
          description: Commit accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'

  /phases/{phaseId}/lock:
    post:
      tags: [Phases]
      operationId: lockPhase
      summary: Lock phase
      parameters:
        - $ref: '#/components/parameters/PhaseId'
      responses:
        '200':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /phases/{phaseId}/unlock:
    post:
      tags: [Phases]
      operationId: unlockPhase
      summary: Unlock phase
      parameters:
        - $ref: '#/components/parameters/PhaseId'
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get background job state
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EntityTypeId:
      name: entityTypeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EntityId:
      name: entityId
      in: path
      required: true
      schema: {type: string, format: uuid}
    FormId:
      name: formId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImportJobId:
      name: importJobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PhaseId:
      name: phaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  schemas:
    ErrorObject:
      type: object
      description: >
        Stable English machine code with a safe Persian (`fa-IR`) user-facing
        message. Clients branch on code and must not branch on translated text.
      properties:
        code:
          type: string
          example: RESOURCE_LOCKED
        message:
          type: string
          example: این مورد در مرحله قفل‌شده قرار دارد و قابل ویرایش نیست.
        details: {}
      required: [code, message]

    SuccessEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          const: true
        data: {}
        error:
          type: 'null'
        meta:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 1}

    RoleAssignmentRequest:
      type: object
      required: [role_code]
      additionalProperties: false
      properties:
        role_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'

    WorkspaceCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        slug: {type: string, minLength: 1, maxLength: 160}
        description: {type: string}

    WorkspaceUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [description]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        version: {type: integer, minimum: 1}

    WorkspaceMemberCreate:
      type: object
      required: [user_id, role_id]
      additionalProperties: false
      properties:
        user_id: {type: string, format: uuid}
        role_id: {type: string, format: uuid}

    EntityTypeCreate:
      type: object
      required: [key, name]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        name: {type: string, minLength: 1, maxLength: 180}
        plural_name: {type: string, maxLength: 180}
        description: {type: string}
        configuration:
          type: object
          additionalProperties: true

    EntityTypeUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [plural_name]
        - required: [description]
        - required: [configuration]
      properties:
        name: {type: string, minLength: 1, maxLength: 180}
        plural_name: {type: [string, 'null'], maxLength: 180}
        description: {type: [string, 'null']}
        configuration:
          type: object
          additionalProperties: true
        version: {type: integer, minimum: 1}

    AttributeCreate:
      type: object
      required: [key, label, data_type]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[a-z][a-z0-9_]*$'
        label: {type: string, minLength: 1, maxLength: 180}
        description: {type: [string, 'null']}
        data_type:
          type: string
          enum:
            - TEXT
            - RICH_TEXT
            - INTEGER
            - DECIMAL
            - BOOLEAN
            - DATE
            - DATETIME
            - ENUM
            - MULTI_ENUM
            - USER_REFERENCE
            - ENTITY_REFERENCE
            - FILE_REFERENCE
            - JSON
            - TABLE
        is_required: {type: boolean, default: false}
        is_read_only: {type: boolean, default: false}
        default_value: {}
        validation_config:
          type: object
          additionalProperties: true
        display_config:
          type: object
          additionalProperties: true
        inheritance_config:
          type: object
          additionalProperties: true
        display_order: {type: integer, minimum: 0, default: 0}

    AttributeUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [label]
        - required: [description]
        - required: [is_required]
        - required: [is_read_only]
        - required: [default_value]
        - required: [validation_config]
        - required: [display_config]
        - required: [inheritance_config]
        - required: [display_order]
      properties:
        label: {type: string, minLength: 1, maxLength: 180}
        description: {type: [string, 'null']}
        is_required: {type: boolean}
        is_read_only: {type: boolean}
        default_value: {}
        validation_config: {type: object, additionalProperties: true}
        display_config: {type: object, additionalProperties: true}
        inheritance_config: {type: object, additionalProperties: true}
        display_order: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}

    EntityCreate:
      type: object
      required: [entity_type_id, name]
      additionalProperties: false
      properties:
        entity_type_id: {type: string, format: uuid}
        parent_id: {type: [string, 'null'], format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        attributes:
          type: object
          additionalProperties: true

    EntityUpdate:
      type: object
      required: [version]
      additionalProperties: false
      anyOf:
        - required: [name]
        - required: [description]
        - required: [attributes]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: [string, 'null']}
        attributes:
          type: object
          additionalProperties: true
        version:
          type: integer
          minimum: 1

    RelationshipCreate:
      type: object
      required: [relationship_type_id, source_entity_id, target_entity_id]
      properties:
        relationship_type_id: {type: string, format: uuid}
        source_entity_id: {type: string, format: uuid}
        target_entity_id: {type: string, format: uuid}
        attributes:
          type: object
          additionalProperties: true

    FormCreate:
      type: object
      required: [key, name]
      properties:
        key: {type: string}
        name: {type: string}
        entity_type_id: {type: [string, 'null'], format: uuid}
        description: {type: string}

  responses:
    NotFound:
      description: Resource not found or not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Effective permission is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request or metadata validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Locked:
      description: Resource locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
