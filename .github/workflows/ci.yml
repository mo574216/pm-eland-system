name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.13"
  NODE_VERSION: "24"
  UV_VERSION: "0.11.25"

jobs:
  backend-quality:
    name: Backend lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --all-groups --locked
      - name: Check backend formatting
        working-directory: backend
        run: uv run --frozen ruff format --check .
      - name: Lint backend
        working-directory: backend
        run: uv run --frozen ruff check .
      - name: Type-check backend
        working-directory: backend
        run: uv run --frozen mypy app scripts tests

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --all-groups --locked
      - name: Run backend tests
        working-directory: backend
        run: uv run --frozen pytest -W error

  frontend-quality:
    name: Frontend lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  frontend-e2e:
    name: Frontend Persian RTL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chrome
        working-directory: frontend
        run: npx playwright install --with-deps chrome
      - name: Verify Persian and RTL workflows
        working-directory: frontend
        run: npm run test:e2e

  migration:
    name: PostgreSQL migration from empty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: pm_system_ci
          POSTGRES_USER: pm_system_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm_system_ci -d pm_system_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://pm_system_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/pm_system_ci
      PSYCOPG_DATABASE_URL: postgresql://pm_system_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/pm_system_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked runtime dependencies
        working-directory: backend
        run: uv sync --locked --no-dev
      - name: Upgrade empty database to head
        working-directory: backend
        run: uv run --frozen alembic upgrade head
      - name: Verify migration head
        working-directory: backend
        run: uv run --frozen alembic current --check-heads
      - name: Verify required PostgreSQL extensions
        working-directory: backend
        run: >-
          uv run --frozen python -c
          "import os, psycopg;
          connection = psycopg.connect(os.environ['PSYCOPG_DATABASE_URL']);
          extensions = {row[0] for row in connection.execute(\"SELECT extname FROM pg_extension WHERE extname IN ('citext', 'pgcrypto')\")};
          connection.close();
          assert extensions == {'citext', 'pgcrypto'}, extensions"
      - name: Verify identity schema and idempotent seeds
        working-directory: backend
        run: uv run --frozen python -m scripts.verify_identity_schema
      - name: Verify workspace schema and isolation constraints
        working-directory: backend
        run: uv run --frozen python -m scripts.verify_workspace_schema
      - name: Verify generic metadata schema
        working-directory: backend
        run: uv run --frozen python -m scripts.verify_metadata_schema
      - name: Verify generic entity schema
        working-directory: backend
        run: uv run --frozen python -m scripts.verify_entity_schema

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    name: Build application and container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-quality
      - backend-tests
      - frontend-quality
      - frontend-tests
      - frontend-e2e
      - migration
      - secret-scan
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Build backend package
        working-directory: backend
        run: uv build
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build backend container image
        run: docker build --file infrastructure/docker/backend.Dockerfile --tag pm-system-backend:ci .
      - name: Build frontend container image
        run: docker build --file infrastructure/docker/frontend.Dockerfile --tag pm-system-frontend:ci .

  required:
    name: Required CI Gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - backend-quality
      - backend-tests
      - frontend-quality
      - frontend-tests
      - frontend-e2e
      - migration
      - secret-scan
      - build
    steps:
      - name: Require every CI stage to pass
        env:
          BACKEND_QUALITY: ${{ needs.backend-quality.result }}
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          FRONTEND_TESTS: ${{ needs.frontend-tests.result }}
          FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
          MIGRATION: ${{ needs.migration.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          for result in "$BACKEND_QUALITY" "$BACKEND_TESTS" "$FRONTEND_QUALITY" "$FRONTEND_TESTS" "$FRONTEND_E2E" "$MIGRATION" "$SECRET_SCAN" "$BUILD"; do
            if [ "$result" != "success" ]; then
              echo "A required CI stage did not pass: $result"
              exit 1
            fi
          done
